<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pirate Beer - Easter Egg 🏴‍☠️❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .easter-egg-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      padding: 20px;
    }

    .easter-egg-container video {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="easter-egg-container">
    <video autoplay loop muted playsinline>
      <source src="../vid/rosane.mp4" type="video/mp4">
      Seu navegador não suporta a exibição deste vídeo.
    </video>
  </div>

</body>
</html>
